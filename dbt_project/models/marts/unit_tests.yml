version: 2

unit_tests:
  - name: completed_orders_sum_to_expected_revenue
    description: A completed order is counted once and summed in USD.
    model: fct_daily_revenue
    given:
      - input: ref('stg_orders')
        rows:
          - {order_id: 1, customer_id: C0001, amount_usd: 100.0, status: completed, order_date: '2026-08-01'}
          - {order_id: 2, customer_id: C0001, amount_usd: 70.0, status: completed, order_date: '2026-08-01'}
      - input: ref('stg_customers')
        rows:
          - {customer_id: C0001, is_active: true, valid_from: '2026-07-01'}
    expect:
      rows:
        - {order_date: '2026-08-01', completed_order_rows: 2, daily_revenue: 170.0}

  - name: active_customer_scd_does_not_inflate_revenue
    description: Multiple active customer versions must not multiply order revenue.
    model: fct_daily_revenue
    given:
      - input: ref('stg_orders')
        rows:
          - {order_id: 10, customer_id: C0002, amount_usd: 55.0, status: completed, order_date: '2026-08-02'}
      - input: ref('stg_customers')
        rows:
          - {customer_id: C0002, is_active: true, valid_from: '2026-07-01'}
          - {customer_id: C0002, is_active: true, valid_from: '2026-08-01'}
    expect:
      rows:
        - {order_date: '2026-08-02', completed_order_rows: 1, daily_revenue: 55.0}
